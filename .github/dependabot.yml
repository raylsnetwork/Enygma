# Dependabot version updates.
#
# Every Go module in the repo must appear under the gomod `directories` list
# below; the `discover modules` job in .github/workflows/ci.yml fails if one
# is missing. Security updates for the existing alerts additionally require
# "Dependabot security updates" to be enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/enygma_dvp/demo"
      - "/enygma_dvp/gnark_circuits"
      - "/enygma_dvp/layout"
      - "/enygma_dvp/relayer"
      - "/enygma_dvp/scripts"
      - "/enygma_dvp/src"
      - "/enygma_dvp/test"
      - "/enygma_dvp_auctions/gnark_circuits"
      - "/enygma_dvp_auctions/scripts"
      - "/enygma_dvp_auctions/src"
      - "/enygma_dvp_auctions/test"
      - "/enygma_gnark_shared"
      - "/enygma_payments/demo"
      - "/enygma_payments/gnark-server"
      - "/enygma_payments/go_client/enygma_test"
      - "/enygma_payments/go_client"
      - "/enygma_payments/layout"
      - "/enygma_payments/relayer"
      - "/enygma_payments/test"
      - "/enygma_retail_payments/demo"
      - "/enygma_retail_payments/gnark_circuits"
      - "/enygma_retail_payments/layout"
      - "/enygma_retail_payments/private_tags/src"
      - "/enygma_retail_payments/private_tags/test"
      - "/enygma_retail_payments/relayer"
      - "/enygma_retail_payments/scripts"
      - "/enygma_retail_payments/shield_demo"
      - "/enygma_retail_payments/src"
      - "/enygma_retail_payments/test"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A gnark or gnark-crypto bump changes the proofs, which then no longer
    # verify against the committed keys (gnark 0.14 -> 0.16 broke the payments
    # gnark server's self-verification, #145). Upgrade them by hand, with
    # new keys.
    ignore:
      - dependency-name: "github.com/consensys/gnark"
      - dependency-name: "github.com/consensys/gnark-crypto"
    groups:
      go-security:
        applies-to: security-updates
        patterns: ["*"]
      go-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - "/enygma_demo"
      - "/enygma_dvp"
      - "/enygma_dvp_auctions"
      - "/enygma_payments/contracts/enygma"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The projects are on Hardhat 2; Hardhat 3 and hardhat-toolbox 6+ need a
    # migration (config, plugins, scripts), not a bump (#142-#144, #161).
    # Pin a vulnerable transitive dependency with `overrides` in package.json
    # instead; `make hardhat-check` (CI's hardhat job) checks the projects
    # still build.
    ignore:
      - dependency-name: "hardhat"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/hardhat-toolbox"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/enygma_payments/run_scripts"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
