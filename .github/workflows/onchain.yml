name: onchain

# The on-chain end-to-end suites, each on a fresh stack on its own runner,
# through the same make targets a developer runs locally:
#   make payments-stack && make payments-test; make payments-stack-stop
#   make dvp-stack && make dvp-test; make dvp-stack-stop
#   make shield-stack && make retail-test; make shield-stack-stop
# A suite fails on any failed test and on any skip not on its known-skip
# list (PAYMENTS_KNOWN_SKIPS, DVP_KNOWN_SKIPS, RETAIL_KNOWN_SKIPS in the root
# Makefile). On failure the stack's and the suite's logs are uploaded as an
# artifact.
# Separate from `ci` so these longer jobs do not hold up the fast checks.
# A pull request runs a suite only when it changes a path that suite's
# filter in scripts/suite_changes.sh names (a change to this workflow, the
# root Makefile, a stack script or the suites' scripts runs all three; docs
# and demo pages run none); a push to main runs every suite.

on:
  push:
    branches: [main]
  pull_request:
    # Every path some suite's filter in scripts/suite_changes.sh names (the
    # stack scripts are under the module dirs). Docs and demo pages under
    # them still start the workflow, but `changes` runs no suite for them.
    paths:
      - "enygma_payments/**"
      - "enygma_dvp/**"
      - "enygma_gnark_shared/**"
      - "enygma_retail_payments/**"
      - "Makefile"
      - "scripts/suite_changes.sh"
      - "scripts/suite_result.sh"
      - ".github/workflows/onchain.yml"

permissions:
  contents: read

# A new push cancels a PR's older run; on main every commit's run finishes,
# so each merged commit is verified.
concurrency:
  group: onchain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which suites this event runs: on a pull request, those whose paths it
  # changes; on a push to main, all of them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      payments: ${{ steps.filter.outputs.payments }}
      dvp: ${{ steps.filter.outputs.dvp }}
      retail: ${{ steps.filter.outputs.retail }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # The paths each suite runs on are in scripts/suite_changes.sh (and
        # its tests in suite_changes.test.js, under make page-check).
        # shell: bash adds pipefail, so a failing filter fails the job.
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only "$BASE...HEAD" | bash scripts/suite_changes.sh
          else
            bash scripts/suite_changes.sh --all
          fi | tee -a "$GITHUB_OUTPUT"

  payments:
    name: payments e2e
    needs: changes
    if: needs.changes.outputs.payments == 'true'
    runs-on: ubuntu-latest
    # The suite runs in under a minute and the stack starts in about one; a
    # Burn key generation on a cache miss adds a few more. payments-test's
    # go test times out at 15 min, so a hung suite fails with its logs first.
    timeout-minutes: 30
    steps:
      # make payments-stack logs here; uploaded when the job fails.
      - run: echo "PAYMENTS_LOG_DIR=$RUNNER_TEMP/payments-logs" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: enygma_payments/go_client/enygma_test/go.mod
          cache-dependency-path: |
            enygma_payments/go_client/enygma_test/go.sum
            enygma_payments/gnark-server/go.sum
            enygma_payments/relayer/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: enygma_payments/contracts/enygma/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: enygma_payments/contracts/enygma

      # The Burn keys are gitignored (the other payments keys are committed
      # through LFS). A change to the burn circuit, what it imports, or the
      # key generator misses the cache and regenerates them. BurnVerifier.sol,
      # which keygen also writes, is not cached: the suite deploys
      # MockBurnVerifier.
      - id: burn-keys
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            enygma_payments/gnark-server/keys/BurnPk.key
            enygma_payments/gnark-server/keys/BurnVk.key
          key: payments-burn-keys-${{ hashFiles('enygma_payments/gnark-server/pkg/circuits/burn/**', 'enygma_payments/gnark-server/poseidon/**', 'enygma_payments/gnark-server/utils/**', 'enygma_payments/gnark-server/keygen/**', 'enygma_payments/gnark-server/go.sum', 'enygma_gnark_shared/**') }}
      - name: generate Burn keys
        if: steps.burn-keys.outputs.cache-hit != 'true'
        working-directory: enygma_payments/gnark-server
        run: go run ./keygen/generate_keys.go -circuit burn

      - run: make payments-stack
      - run: make payments-test
      - if: always()
        run: make payments-stack-stop || true
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payments-logs
          path: |
            ${{ env.PAYMENTS_LOG_DIR }}
            !${{ env.PAYMENTS_LOG_DIR }}/bin
          if-no-files-found: warn

  dvp:
    name: dvp e2e
    needs: changes
    if: needs.changes.outputs.dvp == 'true'
    runs-on: ubuntu-latest
    # The suite and the stack's start each take about 2.5 min here, and a
    # key generation on a cache miss about 30 s. dvp-test's go test times
    # out at 30 min, which this job's timeout cuts short: the logs are still
    # uploaded on cancel.
    timeout-minutes: 30
    steps:
      # make dvp-stack logs here; uploaded when the job fails.
      - run: echo "DVP_LOG_DIR=$RUNNER_TEMP/dvp-logs" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: enygma_dvp/test/go.mod
          cache-dependency-path: |
            enygma_dvp/test/go.sum
            enygma_dvp/src/go.sum
            enygma_dvp/scripts/go.sum
            enygma_dvp/gnark_circuits/go.sum
            enygma_dvp/relayer/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: enygma_dvp/.nvmrc
          cache: npm
          cache-dependency-path: enygma_dvp/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: enygma_dvp

      # The DvP keys are gitignored. make dvp-keygen generates them and copies
      # in retail's PrivateMint keys (committed through LFS). A change to the
      # DvP circuits, what they import (go list -deps ./cmd/keygen), the key
      # generator, or retail's PrivateMint keys misses the cache and
      # regenerates them.
      - id: dvp-keys
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: enygma_dvp/gnark_circuits/scripts/keys
          key: dvp-keys-${{ hashFiles('enygma_dvp/gnark_circuits/templates/**', 'enygma_dvp/gnark_circuits/primitives/**', 'enygma_dvp/gnark_circuits/scripts/*.go', 'enygma_dvp/gnark_circuits/cmd/keygen/**', 'enygma_dvp/gnark_circuits/go.mod', 'enygma_dvp/gnark_circuits/go.sum', 'enygma_gnark_shared/**', 'enygma_retail_payments/gnark_circuits/scripts/keys/PrivateMint*') }}
      - name: generate DvP keys
        if: steps.dvp-keys.outputs.cache-hit != 'true'
        run: make dvp-keygen

      - run: make dvp-stack
      - run: make dvp-test
      - if: always()
        run: make dvp-stack-stop || true
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dvp-logs
          path: |
            ${{ env.DVP_LOG_DIR }}
            !${{ env.DVP_LOG_DIR }}/bin
          if-no-files-found: warn

  retail:
    name: retail e2e
    needs: changes
    if: needs.changes.outputs.retail == 'true'
    runs-on: ubuntu-latest
    # The suite takes 8–12 min on a laptop and the stack about 1 min to
    # start. retail-test's go test times out at 30 min, which this job's
    # timeout cuts short: the logs are still uploaded on cancel.
    timeout-minutes: 40
    steps:
      # make shield-stack logs here; uploaded when the job fails.
      - run: echo "RETAIL_LOG_DIR=$RUNNER_TEMP/retail-logs" >> "$GITHUB_ENV"
      # Retail's keys are committed through LFS and used as committed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: enygma_retail_payments/test/go.mod
          cache-dependency-path: |
            enygma_retail_payments/**/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: enygma_dvp/.nvmrc
          cache: npm
          cache-dependency-path: enygma_dvp/package-lock.json
      # run.sh runs enygma_dvp's Hardhat node and compiles its contracts.
      - run: npm ci --no-audit --no-fund
        working-directory: enygma_dvp

      - run: make shield-stack
      - run: make retail-test
      - if: always()
        run: make shield-stack-stop || true
      # retail-test sets REPLAY_FIXTURE_WRITE=0 and leaves PRIMER_WRITE unset.
      # Also after a failed suite, and counting new untracked files.
      - name: replay fixtures and primer data block unchanged
        if: success() || failure()
        run: |
          changed=$(git status --porcelain -- enygma_retail_payments/shield_demo/testdata enygma_retail_payments/shield_demo/protocol.html)
          [ -z "$changed" ] || { echo "the job rewrote:"; echo "$changed"; exit 1; }
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retail-logs
          path: |
            ${{ env.RETAIL_LOG_DIR }}
            !${{ env.RETAIL_LOG_DIR }}/bin
          if-no-files-found: warn
