# The setup ceremony's participant program, released from a ceremony-v* tag.
#
# Participants get the program from this release, never from the
# coordinator: the code that draws their randomness must not be the
# coordinator's choice. What the release gives is transparency: everyone runs
# GitHub's build of one public commit. Independence comes from outside this
# repository (audit M7): people independent of the organizers review the
# commit and rebuild it (BUILD), and the ceremony's announcement, on a channel
# this repository's admins cannot edit, carries the commit and each binary's
# sha256, which participants compare before running.
#
# Two jobs. build, with read access alone, checks the tag and the coordinator's
# address (scripts/ceremony_release.sh check), builds with
# `make ceremony-dist` (the exact toolchain enygma_ceremony/go.mod pins, CGO
# off, -trimpath, none of the builder's go env), and writes the release notes
# and COMMANDS.txt. publish attests every binary and COMMANDS.txt, and
# publishes them with SHA256SUMS and BUILD: a draft first, then the release,
# only while the tag still names the commit built, checking it before and
# after; then `gh release verify`, which needs immutable releases.
#
# Before pushing the tag:
# - set the repository variable CEREMONY_URL to the coordinator's address, a
#   plain https://host[:port]: the binaries join it when run with no command.
#   No attestation covers it: the rebuild does.
# - turn on immutable releases (organization-enforced, if you can), so assets
#   and tags cannot change once published; the notes can still be edited.
# - protect refs/tags/ceremony-v* with a ruleset that restricts creation and
#   blocks updates and deletions, with no bypass (audit M10).
name: ceremony-release

on:
  push:
    tags: ["ceremony-v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CEREMONY_URL: ${{ vars.CEREMONY_URL }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag and the coordinator's address
        run: scripts/ceremony_release.sh check
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: enygma_ceremony/go.mod
          cache: false
      - name: Build
        run: make ceremony-dist # CEREMONY_URL from the environment, as data (Makefile)
      - name: Write the release notes and COMMANDS.txt
        run: scripts/ceremony_release.sh notes enygma_ceremony/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ceremony-dist
          path: enygma_ceremony/dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestations
      attestations: write # store them
    env:
      CEREMONY_URL: ${{ vars.CEREMONY_URL }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ceremony-dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ceremony-*
            dist/COMMANDS.txt
      - name: Publish, while the tag names the commit built
        run: scripts/ceremony_release.sh publish dist
