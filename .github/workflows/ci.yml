name: ci

# Build, vet and unit-test every Go module, enforce gofmt, compile the HTML
# pages' inline scripts, install, compile and test the Hardhat projects, and
# check the committed retail keys' circuit-sources stamp.
# Run the same checks locally with `make ci` (see the root Makefile).
# Integration tests that need a chain or gnark server skip themselves here;
# the on-chain suites run them on a live stack in the `onchain` workflow
# (.github/workflows/onchain.yml).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    name: discover modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      # Module paths become matrix values, so only plain relative paths
      # (letters, digits, _ . / -, no "..") are accepted.
      - id: list
        run: |
          dirs=$(git ls-files '*go.mod' | xargs -n1 dirname | sort)
          bad=$(printf '%s\n' "$dirs" | grep -Ev '^[A-Za-z0-9_][A-Za-z0-9_./-]*$' || true)
          bad="$bad$(printf '%s\n' "$dirs" | grep -E '(^|/)\.\.(/|$)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::unexpected Go module path(s): $bad"
            exit 1
          fi
          echo "matrix=$(printf '%s\n' "$dirs" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
      # Fail loudly when a new module is added but Dependabot does not cover it.
      - name: Every Go module is listed in dependabot.yml
        run: |
          missing=0
          for d in $(git ls-files '*go.mod' | xargs -n1 dirname); do
            if ! grep -q "\"/$d\"" .github/dependabot.yml; then
              echo "::error::$d has a go.mod but is not covered by .github/dependabot.yml"
              missing=1
            fi
          done
          exit $missing

  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "stable"
      # test-name-skip-check reads only tracked files: no stack, no go.
      - run: make fmt-check go-min-check test-name-skip-check

  # No lfs: each check reads keys.src and the circuit sources, never a .key.
  # Each step's setup-go reads its module's go.mod.
  committed-keys:
    name: committed keys stamps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: enygma_retail_payments/gnark_circuits/go.mod
          cache-dependency-path: enygma_retail_payments/gnark_circuits/go.sum
      - run: make retail-keys-check
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: enygma_payments/gnark-server/go.mod
          cache-dependency-path: enygma_payments/gnark-server/go.sum
      - run: make payments-keys-check

  pages:
    name: page scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      # The scripts' tests run go: errcheck_skip_check.test.js runs the
      # pinned errcheck, which needs the Makefile's GO_MIN.
      - id: go-min
        run: |
          v=$(sed -n 's/^GO_MIN := \([0-9.]*\)$/\1/p' Makefile)
          [ -n "$v" ] || { echo "::error::no GO_MIN := <version> line in the Makefile"; exit 1; }
          echo "go=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.go-min.outputs.go }}
          cache: false
      - run: make page-check

  hardhat:
    name: hardhat projects
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            enygma_dvp/package-lock.json
            enygma_dvp_auctions/package-lock.json
            enygma_payments/contracts/enygma/package-lock.json
      - run: make hardhat-check

  go:
    name: go (${{ matrix.module }})
    needs: modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # known-red-check runs this module's TEST_SKIP_PACKAGES entries (and
      # fails on one no module owns), with this leg's LFS objects and go;
      # errcheck-skip-check runs errcheck here when ERRCHECK_SKIP_MODULES
      # skips this module (and fails on an entry naming no module).
      - name: build, vet, errcheck, test, known-red, errcheck-skip
        env:
          MODULE: ${{ matrix.module }}
        run: |
          [[ "$MODULE" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]*$ && "$MODULE" != *..* ]] || { echo "::error::bad module path"; exit 1; }
          make build vet errcheck test-unit known-red-check errcheck-skip-check MODULE="$MODULE"
