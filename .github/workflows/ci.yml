name: ci

# Build, vet and unit-test every Go module, enforce gofmt, compile the HTML
# pages' inline scripts, and install, compile and test the Hardhat projects.
# Run the same checks locally with `make ci` (see the root Makefile).
# Integration tests that need a chain or gnark server skip themselves and are
# not exercised here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    name: discover modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      # Module paths become matrix values, so only plain relative paths
      # (letters, digits, _ . / -, no "..") are accepted.
      - id: list
        run: |
          dirs=$(git ls-files '*go.mod' | xargs -n1 dirname | sort)
          bad=$(printf '%s\n' "$dirs" | grep -Ev '^[A-Za-z0-9_][A-Za-z0-9_./-]*$' || true)
          bad="$bad$(printf '%s\n' "$dirs" | grep -E '(^|/)\.\.(/|$)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::unexpected Go module path(s): $bad"
            exit 1
          fi
          echo "matrix=$(printf '%s\n' "$dirs" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
      # Fail loudly when a new module is added but Dependabot does not cover it.
      - name: Every Go module is listed in dependabot.yml
        run: |
          missing=0
          for d in $(git ls-files '*go.mod' | xargs -n1 dirname); do
            if ! grep -q "\"/$d\"" .github/dependabot.yml; then
              echo "::error::$d has a go.mod but is not covered by .github/dependabot.yml"
              missing=1
            fi
          done
          exit $missing

  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "stable"
      - run: make fmt-check

  pages:
    name: page scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: make page-check

  hardhat:
    name: hardhat projects
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            enygma_dvp/package-lock.json
            enygma_dvp_auctions/package-lock.json
            enygma_payments/contracts/enygma/package-lock.json
      - run: make hardhat-check

  go:
    name: go (${{ matrix.module }})
    needs: modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: build, vet, errcheck, test
        env:
          MODULE: ${{ matrix.module }}
        run: |
          [[ "$MODULE" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]*$ && "$MODULE" != *..* ]] || { echo "::error::bad module path"; exit 1; }
          make build vet errcheck test-unit MODULE="$MODULE"
