default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        # Fails (and lists the files) instead of silently rewriting them.
        entry: bash -c 'bad=$(gofmt -l "$@"); if [ -n "$bad" ]; then echo "Not gofmt-clean (run gofmt -w on):"; echo "$bad"; exit 1; fi' --
        language: system
        files: '\.go$'
      - id: page-scripts
        name: page scripts
        # Checks each HTML page's inline <script> (syntax), <style> (a selector defined twice) and MathML (what Chrome drops).
        entry: node scripts/check_page_scripts.js
        language: system
        files: '\.html$'
      - id: red-named
        name: a commit adding a check names its red
        # A staged Go/JS test or subtest needs a RED line (its mutation) or "No red: <why>" in the message.
        entry: scripts/check_red_named.sh
        language: system
        stages: [commit-msg]
        always_run: true
      - id: merged-branch
        name: branch's PR not already merged
        entry: scripts/refuse_merged_branch.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
