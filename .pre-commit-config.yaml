repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        # Fails (and lists the files) instead of silently rewriting them.
        entry: bash -c 'bad=$(gofmt -l "$@"); if [ -n "$bad" ]; then echo "Not gofmt-clean (run gofmt -w on):"; echo "$bad"; exit 1; fi' --
        language: system
        files: '\.go$'
      - id: page-scripts
        name: page scripts
        # Compiles each HTML page's inline <script>, so a syntax error in a demo page fails here.
        entry: node scripts/check_page_scripts.js
        language: system
        files: '\.html$'
